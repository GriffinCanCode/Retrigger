# Retrigger daemon configuration for the container images.
#
# Every key here is read by the daemon, and unknown keys are rejected rather
# than ignored -- run `retrigger validate -c <file>` after editing. The previous
# version of this file predated the 2.0 daemon and described sections that no
# longer exist ([performance], metrics_port, zero-copy IPC), which meant the
# image booted straight into a config parse error.

[server]
# Containers must be reachable from outside the network namespace, so this
# binds to all interfaces rather than the 127.0.0.1 default. Publish the port
# deliberately (-p) and keep the daemon off untrusted networks: it exposes an
# unauthenticated control API that can add watch roots.
bind_address = "0.0.0.0"
port = 9090

[watcher]
queue_capacity = 4096
debounce_ms = 50
# Bind mounts are frequently symlinked on the host side.
follow_symlinks = true
hash_cache_size = 100000
hash_cache_ttl_secs = 3600

[patterns]
include = []
exclude = [
    "**/node_modules/**",
    "**/.git/**",
    "**/target/**",
    "**/dist/**",
    "**/build/**",
    "**/.next/**",
    "**/coverage/**",
    "**/*.tmp",
    "**/*.swp",
    "**/*~",
    "**/.DS_Store",
]

[logging]
level = "info"
# One JSON object per line, which is what a container log shipper wants.
format = "json"

# Nothing is watched until a root is declared. The image declares none, because
# the path only exists once something is mounted: run with
#   -v "$PWD:/workspace" and uncomment the block below,
# or add it at runtime with `POST /watch`.
#
# [[watcher.paths]]
# path = "/workspace"
# recursive = true
