# Declares the components a working checkout needs, so `make lint` does not
# fail with "rustfmt is not installed" on a fresh machine.
#
# The channel is "stable" rather than a pinned version on purpose: the MSRV job
# in CI is what defends rust-version = "1.75", and pinning here would only
# create a second, silently diverging answer to the same question. CI's
# toolchain actions set RUSTUP_TOOLCHAIN, which takes precedence over this
# file, so the MSRV job still gets the older compiler it asks for.
[toolchain]
channel = "stable"
components = ["rustfmt", "clippy"]
profile = "minimal"
