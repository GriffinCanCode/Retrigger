[workspace]
members = [
    "src/daemon/retrigger-daemon",
    "src/daemon/retrigger-core",
    "src/daemon/retrigger-system",
    # The Node addon lives beside the npm package it ships in, which is where
    # `napi build` expects to run. It used to exist twice -- once here and once
    # as src/daemon/retrigger-bindings -- as two crates compiling one shared
    # source file via a [lib] path override.
    "src/bindings/nodejs",
]
resolver = "2"

[workspace.package]
version = "2.0.0"
edition = "2021"
# Floor set by the dependency graph, not by taste: notify 8 requires 1.77,
# criterion 0.8 requires 1.86, and napi 3 requires 1.88, so --all-targets needs
# 1.88. The CI msrv job reads this value, so it has to stay true rather than
# aspirational.
rust-version = "1.88"
license = "MIT"
authors = ["Griffin Strier"]
repository = "https://github.com/GriffinCanCode/Retrigger"
homepage = "https://github.com/GriffinCanCode/Retrigger"
readme = "README.md"

[workspace.dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
blake3 = "1.5"
parking_lot = "0.12"

[profile.release]
lto = true
codegen-units = 1
strip = true
# Deliberately NOT panic = "abort". The Node addon relies on unwinding so that
# napi-rs can convert a Rust panic into a JavaScript exception; aborting would
# take down the user's dev server instead of surfacing a catchable error.
panic = "unwind"

[profile.bench]
lto = true
codegen-units = 1
debug = true
