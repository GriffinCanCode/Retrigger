[package]
name = "retrigger-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "Optional standalone Retrigger daemon: one watcher shared by several processes over HTTP"
keywords = ["file-watcher", "daemon", "inotify", "fsevents", "hot-reload"]
categories = [
    "development-tools",
    "filesystem",
    "command-line-utilities",
    "web-programming::http-server",
]

[[bin]]
name = "retrigger"
path = "src/main.rs"

[dependencies]
retrigger-core = { path = "../retrigger-core" }
retrigger-system = { path = "../retrigger-system" }

tokio = { workspace = true }
serde = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
# The `json` feature backs `logging.format = "json"`, which is what the container
# image ships with; features are additive, so this does not affect other crates.
tracing-subscriber = { workspace = true, features = ["json"] }

clap = { version = "4.5", features = ["derive"] }
toml = "1.1"
# The API is HTTP/JSON because the daemon's whole purpose is to be reachable
# from processes it did not spawn, in languages it does not know about. axum
# carries the routing, JSON extraction, and server-sent events used by /events.
axum = "0.8"
serde_json = "1.0"
# ReceiverStream: the one adapter needed to hand axum's SSE response a Stream.
# Nothing here needs a general stream-combinator library.
tokio-stream = "0.1"

[dev-dependencies]
tempfile = "3"
proptest = "1.9"
