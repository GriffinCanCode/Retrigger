[package]
name = "retrigger-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "XXH3-64 hashing engine for Retrigger, with runtime SIMD dispatch"
keywords = ["xxhash", "xxh3", "hash", "simd", "checksum"]
categories = ["algorithms", "development-tools::ffi", "filesystem"]

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
# bindgen was removed deliberately: it drags libclang onto every machine that
# builds from source, and the FFI surface here is small enough to declare by
# hand with matching layout assertions on both sides of the boundary.
cc = "1.0"
