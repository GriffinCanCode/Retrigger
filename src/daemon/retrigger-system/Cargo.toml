[package]
name = "retrigger-system"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "Cross-platform file system watcher for Retrigger, built on the notify crate"
keywords = ["file-watcher", "inotify", "fsevents", "notify", "filesystem"]
categories = ["filesystem", "development-tools", "os"]

[dependencies]
notify = "8.2"
tokio = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
globset = "0.4"
regex = "1.11"

[dev-dependencies]
tempfile = "3.23"
proptest = "1.9"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
serde_json = "1.0.151"

[[bench]]
name = "watcher"
harness = false
